<title id="t">Schematic excited-state pathway between two emitters</title><desc id="d">Ground- and excited-state energy curves along a configuration coordinate. After absorption at configuration A, the system can cross a small barrier on the excited-state surface to configuration B; each configuration emits a photon of a different color. Illustrative only.</desc>
